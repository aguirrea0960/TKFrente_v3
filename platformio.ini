; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
	factory_settings.ini
	features.ini
default_envs = esp12e, esp32s3

[env]
build_flags = 
	${factory_settings.build_flags}
	${features.build_flags}
	-D NO_GLOBAL_ARDUINOOTA
	; Uncomment PROGMEM_WWW to enable the storage of the WWW data in PROGMEM
    ;-D PROGMEM_WWW
  
lib_compat_mode = strict
framework = arduino
;monitor_speed = 115200
extra_scripts = pre:scripts/build_interface.py
lib_deps = 
	https://github.com/me-no-dev/ESPAsyncWebServer
	bblanchon/ArduinoJson @<7.0.0
    AsyncMqttClient
	
[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
#upload_protocol = espota
#upload_port = 192.168.4.1
#upload_flags =
#  --port=8266

[env:node32s]
platform = espressif32@6.2.0
board = node32s
board_upload.flash_size = 16MB
board_build.filesystem = littlefs

[env:envESP32_C3L]
platform = espressif32 @6.9.0
board = esp32dev
board_build.mcu = esp32c3
board_build.filesystem = littlefs
board_upload.before_reset = usb_reset
#build_flags = 
#   -D CORE_DEBUG_LEVEL=5
#   -D ARDUHAL_LOG_LEVEL=(-1)
#	-D ARDUINO_USB_MODE=1
#	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:envESP32_C3L-WiFi]      #Este es el hardware actual:
platform = espressif32@6.4.0
board = esp32dev
board_build.mcu = esp32c3
board_build.filesystem = littlefs
board_upload.before_reset = usb_reset
upload_protocol = espota
upload_port = 192.168.10.190
upload_flags =
  --port=8266
  --auth=esp-react

[env:esp32doit-devkit-v1]
platform = espressif32 @6.2.0
board = esp32doit-devkit-v1
board_build.mcu = esp32
board_build.filesystem = littlefs

[env:node32s_2]
; Comment out min_spiffs.csv setting if disabling PROGMEM_WWW with ESP32
; board_build.partitions = min_spiffs.csv
platform = espressif32
board = node32s
board_build.filesystem = littlefs

[env:esp32s3]
platform = espressif32 @6.11.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.filesystem = littlefs
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
